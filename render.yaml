# Render Blueprint for the API (docs/DEPLOY.md).
# Render → New → Blueprint → pick this repository and the branch to deploy. Values marked
# `sync: false` are asked for once when the Blueprint is created; `generateValue` makes a random
# secret. The database and the files are on Supabase (free, no card), the website on Vercel.

services:
  - type: web
    name: wathiq-api
    runtime: node
    plan: free # Sleeps after ~15 minutes without requests; the first request then waits ~1 minute.
    region: frankfurt
    # No `branch`: the service deploys the branch chosen when the Blueprint is created.
    autoDeploy: true
    healthCheckPath: /api/v1/health
    # Dev dependencies are needed to build (Nest CLI, TypeScript, Prisma CLI) and for the seed.
    buildCommand: npm ci --include=dev && npm run build -w api
    # Every start: apply new migrations, run the seed (safe to repeat: sections, topics, the
    # official account, the admin), then start. API_PUBLIC_URL falls back to Render's own address.
    startCommand: >-
      cd api &&
      npx prisma migrate deploy &&
      (npm run db:seed || echo "Seed failed: check ADMIN_EMAIL and ADMIN_PASSWORD (12+ characters).") &&
      API_PUBLIC_URL="${API_PUBLIC_URL:-$RENDER_EXTERNAL_URL}" node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # CV PDFs (puppeteer): Chrome is downloaded at build time. Only files inside the project
      # folder are still there when the service runs, so keep Chrome's cache in it.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # Supabase → Connect → Direct → Session pooler (port 5432, not 6543), with the database
      # password in place of [YOUR-PASSWORD].
      - key: DATABASE_URL
        sync: false

      # Secrets made by Render. Copy WEB_PROXY_SECRET to Vercel too (same value).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: WEB_PROXY_SECRET
        generateValue: true

      # The website's address on Vercel, e.g. https://wathiq.vercel.app (CORS).
      - key: FRONTEND_URL
        sync: false

      # Files: Supabase Storage → Settings → S3 Configuration (docs/DEPLOY.md, step 1).
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # First admin and the platform's official account (created by the seed).
      - key: ADMIN_NAME
        value: Platform Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICIAL_ACCOUNT_NAME
        value: واثق
      - key: OFFICIAL_ACCOUNT_EMAIL
        sync: false

      # Sign-up codes by email: gmail or brevo (console only writes them to the log).
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM_NAME
        value: واثق
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false

      # Signs the offline copy in shared CV QR codes. Make it once (command in api/.env.example)
      # and never change it after launch. Empty = no offline copy.
      - key: CV_SIGNING_PRIVATE_KEY
        sync: false

      - key: OTP_SMS_ENABLED
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      - key: SEED_DEMO
        value: "false"
